# Create a GitHub release whose TAG is the plain version, e.g. 1.5.0
# (NOT v1.5.0 - the self-updater's semver parsing rejects the "v").

on:
  release:
    types: [created]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            assets/update-linux-amd64.gz \
            assets/update-windows-amd64.exe.gz \
            assets/update-darwin-amd64.gz \
            assets/installer-WBG-tool.exe \
            assets/WBG-albion-data-client-amd64-mac.zip \
            --repo "${{ github.repository }}" --clobber

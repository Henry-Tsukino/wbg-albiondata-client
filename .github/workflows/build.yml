# Reusable build workflow shared by test-build.yml (push/PR) and release.yml.
# The version comes from the git tag (GITHUB_REF_NAME), which must look like
# 1.5.0 (no leading "v") - see scripts/version.sh. On push/PR there is no tag,
# so a fixed test version is used.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "0.0.1"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-linux-amd64.gz
          - os: windows
            runner: windows-latest
            artifacts: |
              dist/WBG-albion-data-client.exe
              dist/update-windows-amd64.exe.gz
              dist/installer-WBG-tool.exe
          - os: darwin
            runner: macos-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-darwin-amd64.gz
              dist/WBG-albion-data-client-amd64-mac.zip
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        if: matrix.os == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        run: make build-${{ matrix.os }}

      - name: Vet
        if: matrix.os == 'linux'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'linux'
        run: go test ./...

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

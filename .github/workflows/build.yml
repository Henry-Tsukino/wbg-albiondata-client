# Reusable build workflow shared by test-build.yml (push/PR) and release.yml.
# The version comes from the git tag (GITHUB_REF_NAME), which must look like
# 1.5.0 (no leading "v") - see scripts/version.sh. On push/PR there is no tag,
# so a fixed test version is used.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "0.0.1"
      sign:
        description: "Sign Windows binaries with SignPath (needs the SIGNPATH_* variables and secret)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-linux-amd64.gz
              dist/GNU-Linux.tar.gz
          - os: windows
            runner: windows-latest
            artifacts: |
              dist/WBG-albion-data-client.exe
              dist/update-windows-amd64.exe.gz
              dist/installer-WBG-tool.exe
          - os: darwin
            runner: macos-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-darwin-amd64.gz
              dist/WBG-albion-data-client-amd64-mac.zip
    permissions:
      contents: read
      actions: read   # required by the SignPath action to verify the build origin
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      # Signing is on only for releases, and only when SignPath is configured
      # (repository variables SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG,
      # secret SIGNPATH_API_TOKEN). Otherwise unsigned builds are produced.
      SIGN: ${{ inputs.sign && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        if: matrix.os == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        if: matrix.os != 'windows' || env.SIGN != 'true'
        run: make build-${{ matrix.os }}

      # ---- Windows with SignPath: sign the exe first, then build the update
      # asset and installer from the SIGNED exe, then sign the installer.
      - name: Build Windows exe (unsigned)
        if: matrix.os == 'windows' && env.SIGN == 'true'
        run: SKIP_INSTALLER=1 make build-windows

      - name: Upload unsigned exe
        id: unsigned-exe
        if: matrix.os == 'windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-exe
          path: dist/WBG-albion-data-client.exe

      - name: Sign exe with SignPath
        if: matrix.os == 'windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Build update asset and installer from the signed exe
        if: matrix.os == 'windows' && env.SIGN == 'true'
        run: PREBUILT_EXE="signed-exe/WBG-albion-data-client.exe" make build-windows

      - name: Upload unsigned installer
        id: unsigned-installer
        if: matrix.os == 'windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer
          path: dist/installer-WBG-tool.exe

      - name: Sign installer with SignPath
        if: matrix.os == 'windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Use signed installer
        if: matrix.os == 'windows' && env.SIGN == 'true'
        run: cp signed-installer/installer-WBG-tool.exe dist/installer-WBG-tool.exe

      - name: Vet
        if: matrix.os == 'linux'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'linux'
        run: go test ./...

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

# Reusable build workflow shared by test-build.yml (push/PR) and release.yml.
# The version comes from the git tag (GITHUB_REF_NAME), which must look like
# 1.5.0 (no leading "v") - see scripts/version.sh. On push/PR there is no tag,
# so a fixed test version is used.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: "0.0.1"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-linux-amd64.gz
              dist/GNU-Linux.tar.gz
          - os: windows
            runner: windows-latest
            artifacts: |
              dist/WBG-albion-data-client.exe
              dist/update-windows-amd64.exe.gz
              dist/installer-WBG-tool.exe
          - os: darwin
            runner: macos-latest
            artifacts: |
              dist/WBG-albion-data-client
              dist/update-darwin-amd64.gz
              dist/WBG-albion-data-client-amd64-mac.zip
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        if: matrix.os == 'windows'
        run: choco install innosetup --no-progress -y

      # Bundled into the installer (installer/wbg.iss expects npcap-1.87.exe in the
      # repo root; if you bump the version, change the name in wbg.iss too).
      - name: Download Npcap from npcap.com
        if: matrix.os == 'windows'
        env:
          NPCAP_VERSION: "1.87"
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "npcap-${NPCAP_VERSION}.exe" \
            "https://npcap.com/dist/npcap-${NPCAP_VERSION}.exe"
          size=$(wc -c < "npcap-${NPCAP_VERSION}.exe")
          echo "npcap-${NPCAP_VERSION}.exe: ${size} bytes"
          # sanity check: the real installer is ~1.3 MB; a tiny file means an HTML error page
          [ "$size" -gt 500000 ] || { echo "Npcap download looks broken" >&2; exit 1; }
          sha256sum "npcap-${NPCAP_VERSION}.exe"

      - name: Build
        run: make build-${{ matrix.os }}

      - name: Vet
        if: matrix.os == 'linux'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'linux'
        run: go test ./...

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
